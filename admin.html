<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Administración · FUTURO U</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#002C51;--navy-deep:#001D38;--red:#BB0618;--red-bright:#FE0310;--ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--ink:#0E1A2B;--mist:#F2F5F9;--line:#DDE5EE;--muted:#5B6B7E;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:var(--mist);min-height:100vh;}
  .hidden{display:none!important;}
  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));}
  .login-box{background:#fff;border-radius:20px;padding:40px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .login-box img{height:70px;display:block;margin:0 auto 18px;}
  .login-box h1{font-size:22px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:4px;}
  .login-box .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  input{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:16px;}
  input:focus{outline:none;border-color:var(--navy);}
  .btn{font-family:inherit;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:all .18s;}
  .btn-red{background:var(--red);color:#fff;padding:13px;width:100%;font-size:16px;}
  .btn-red:hover{background:var(--red-bright);}
  .btn-red:disabled{opacity:.6;}
  .err{background:#fee2e2;color:#991b1b;padding:11px 14px;border-radius:9px;font-size:14px;margin-bottom:14px;display:none;}
  .err.show{display:block;}
  /* PANEL */
  .topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .topbar .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;}
  .topbar .brand img{height:36px;}
  .topbar .user{font-size:14px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:14px;}
  .topbar .logout{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;}
  .topbar .logout:hover{background:rgba(255,255,255,.28);}
  .container{max-width:1100px;margin:0 auto;padding:28px 20px;}
  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  .stat{background:#fff;border-radius:14px;padding:20px;border:1px solid var(--line);}
  .stat .n{font-size:32px;font-weight:800;color:var(--navy);line-height:1;}
  .stat .l{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;}
  .stat.ok .n{color:var(--ok);}
  .stat.pend .n{color:var(--warn);}
  /* TABLA */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar h2{font-size:19px;font-weight:800;color:var(--navy);}
  .search{padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;min-width:220px;}
  .card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:14px 16px;border-bottom:2px solid var(--line);background:var(--mist);}
  td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fafbfc;}
  .nombre{font-weight:600;color:var(--ink);}
  .sub-td{font-size:12px;color:var(--muted);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px;}
  .badge.hab{background:var(--ok-soft);color:var(--ok);}
  .badge.no{background:#fef3c7;color:var(--warn);}
  .area-tag{font-size:11px;font-weight:700;color:var(--navy);background:var(--mist);padding:3px 9px;border-radius:6px;}
  .btn-hab{background:var(--ok);color:#fff;padding:8px 16px;font-size:13px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;}
  .btn-hab:hover{background:#16a34a;}
  .btn-deshab{background:#fff;color:var(--red);border:1.5px solid var(--red);padding:7px 15px;font-size:13px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;}
  .btn-deshab:hover{background:var(--red);color:#fff;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .loading{padding:40px;text-align:center;color:var(--muted);}
  .carnet-input{width:110px;padding:7px 10px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px;}
  @media(max-width:720px){
    .stats{grid-template-columns:1fr 1fr;}
    table,thead,tbody,th,td,tr{display:block;}
    thead{display:none;}
    tr{border-bottom:2px solid var(--line);padding:8px 0;}
    td{border:none;padding:6px 16px;}
  }
</style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SB_URL='https://ksfxaucrgpvklyonhzgw.supabase.co';
    const SB_KEY='sb_publishable_8ZuLBn8yUda7uMbBjW3OGA_5XAk0Ic3';
    let sb=null; try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){console.error(e);}

    const CARRERA_AREA={"Ingeniería en Agrimensura": "exactas", "Electrónica": "exactas", "Mecánica General": "exactas", "Electricidad Industrial": "exactas", "Construcciones Civiles": "exactas", "Ofimática": "exactas", "Ingeniería en Metalurgia": "exactas", "Ingeniería en Materiales": "exactas", "Mecánica Automotriz": "exactas", "Mecánica de Producción": "exactas", "Mecánica Industrial": "exactas", "Siderurgia": "exactas", "Ingeniería Forestal": "exactas", "Biología": "exactas", "Ingeniería Agronómica": "exactas", "Ciencias Ambientales": "exactas", "Ingeniería Agrícola": "exactas", "Economía": "economicas", "Administración de Empresas": "economicas", "Ingeniería Comercial": "economicas", "Ingeniería Financiera": "economicas", "Comercio Internacional": "economicas", "Ingeniería Civil": "exactas", "Ingeniería Electromecánica": "exactas", "Ingeniería Industrial": "exactas", "Ingeniería Petrolera": "exactas", "Ingeniería Química": "exactas", "Ingeniería de Alimentos": "exactas", "Ingeniería Ambiental": "exactas", "Ingeniería de Control de Procesos": "exactas", "Ingeniería Mecatrónica": "exactas", "Ingeniería Eléctrica": "exactas", "Ingeniería Electrónica": "exactas", "Ingeniería Mecánica": "exactas", "Ingeniería Informática": "computacion", "Ingeniería en Sistemas": "computacion", "Ingeniería en Redes y Telecomunicaciones": "computacion", "Ingeniería en Robótica": "computacion", "Relaciones Internacionales": "humanidades", "Ciencias Políticas y Administración Pública": "humanidades", "Derecho": "humanidades", "Trabajo Social": "humanidades", "Medicina Veterinaria y Zootecnia": "salud", "Ciencias de la Educación": "humanidades", "Ciencias de la Comunicación": "humanidades", "Sociología": "humanidades", "Psicología": "humanidades", "Gestión del Turismo": "humanidades", "Lenguas Modernas y Filología Hispánica": "humanidades", "Actividad Física": "humanidades", "Medicina": "salud", "Enfermería": "salud", "Odontología": "salud", "Bioquímica": "salud", "Farmacia": "salud", "Arquitectura": "exactas", "Planificación Territorial": "exactas", "Diseño Integral": "exactas", "Arte": "exactas", "Contaduría Pública": "contables", "Información y Control de Gestión": "contables", "Banca, Seguros y Valores": "contables"};
    let sesionUser=null;
    let inscritos=[];

    // ---- LOGIN ----
    document.getElementById('btnLogin').addEventListener('click', login);
    document.getElementById('clave').addEventListener('keypress',e=>{if(e.key==='Enter')login();});

    async function login(){
      const u=document.getElementById('usuario').value.trim();
      const c=document.getElementById('clave').value;
      const err=document.getElementById('loginErr');
      const btn=document.getElementById('btnLogin');
      err.classList.remove('show');
      if(!u||!c){err.textContent='Ingresá usuario y contraseña.';err.classList.add('show');return;}
      if(!sb){err.textContent='Sin conexión. Revisá tu internet.';err.classList.add('show');return;}
      btn.disabled=true;btn.textContent='Verificando...';
      try{
        const {data,error}=await sb.from('admin_users').select('usuario,clave,nombre,rol,activo').eq('usuario',u).eq('activo',true).limit(1);
        if(error)throw error;
        if(!data||!data.length||data[0].clave!==c){
          err.textContent='Usuario o contraseña incorrectos.';err.classList.add('show');
          btn.disabled=false;btn.textContent='Ingresar';return;
        }
        sesionUser=data[0];
        document.getElementById('userLabel').textContent=sesionUser.nombre||sesionUser.usuario;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('panelScreen').classList.remove('hidden');
        cargarInscritos();
      }catch(e){
        err.textContent='Error al verificar. Intentá de nuevo.';err.classList.add('show');
        btn.disabled=false;btn.textContent='Ingresar';
      }
    }
    function cerrarSesion(){location.reload();}

    // ---- CARGAR INSCRITOS ----
    async function cargarInscritos(){
      const {data,error}=await sb.from('inscritos').select('*').order('creado_en',{ascending:false});
      if(error){document.getElementById('tablaLoading').textContent='Error al cargar.';return;}
      inscritos=data||[];
      actualizarStats();
      render(inscritos);
    }

    function actualizarStats(){
      const tot=inscritos.length;
      const hab=inscritos.filter(i=>i.habilitado).length;
      const semana=Date.now()-7*24*60*60*1000;
      const nuevos=inscritos.filter(i=>new Date(i.creado_en).getTime()>semana).length;
      document.getElementById('stTotal').textContent=tot;
      document.getElementById('stHab').textContent=hab;
      document.getElementById('stPend').textContent=tot-hab;
      document.getElementById('stHoy').textContent=nuevos;
    }

    function areaDeCarrera(carrera){
      return CARRERA_AREA[carrera] || 'exactas';
    }

    function render(lista){
      const tbody=document.getElementById('tbody');
      document.getElementById('tablaLoading').classList.add('hidden');
      if(!lista.length){
        document.getElementById('tabla').classList.add('hidden');
        document.getElementById('vacio').classList.remove('hidden');
        return;
      }
      document.getElementById('vacio').classList.add('hidden');
      document.getElementById('tabla').classList.remove('hidden');
      tbody.innerHTML=lista.map(i=>{
        const area=i.area||areaDeCarrera(i.carrera_objetivo);
        const hab=i.habilitado;
        const carnetCell = hab
          ? (i.carnet||'-')
          : `<input class="carnet-input" id="carnet-${i.id}" placeholder="Carnet" value="${i.carnet||''}">`;
        const accion = hab
          ? `<button class="btn-deshab" onclick="deshabilitar('${i.id}')">Deshabilitar</button>`
          : `<button class="btn-hab" onclick="habilitar('${i.id}')">Habilitar</button>`;
        return `<tr>
          <td><div class="nombre">${i.nombre||'-'}</div><div class="sub-td">${i.email||''} · ${i.telefono||''}</div></td>
          <td>${i.carrera_objetivo||'-'}<div class="sub-td">${i.examen||''}</div></td>
          <td><span class="area-tag">${area}</span></td>
          <td>${carnetCell}</td>
          <td><span class="badge ${hab?'hab':'no'}">${hab?'Habilitado':'Pendiente'}</span></td>
          <td>${accion}</td>
        </tr>`;
      }).join('');
    }

    // ---- HABILITAR ----
    async function habilitar(id){
      const insc=inscritos.find(x=>x.id===id);
      if(!insc)return;
      const carnetInput=document.getElementById('carnet-'+id);
      const carnet=(carnetInput?carnetInput.value.trim():insc.carnet||'').trim();
      if(!carnet){alert('Ingresá el número de carnet del alumno antes de habilitar.');return;}
      const area=areaDeCarrera(insc.carrera_objetivo);
      try{
        // 1) crear/actualizar en alumnos_habilitados
        await sb.from('alumnos_habilitados').upsert([{
          carnet:carnet, nombre:insc.nombre, area:area,
          carrera:insc.carrera_objetivo, habilitado:true
        }],{onConflict:'carnet'});
        // 2) marcar el inscrito como habilitado
        await sb.from('inscritos').update({
          habilitado:true, carnet:carnet, area:area, habilitado_en:new Date().toISOString()
        }).eq('id',id);
        // refrescar
        insc.habilitado=true;insc.carnet=carnet;insc.area=area;
        actualizarStats();render(filtrar());
      }catch(e){alert('Error al habilitar: '+e.message);}
    }

    async function deshabilitar(id){
      const insc=inscritos.find(x=>x.id===id);
      if(!insc)return;
      if(!confirm('¿Quitar el acceso al simulador de '+(insc.nombre||'este alumno')+'?'))return;
      try{
        if(insc.carnet){
          await sb.from('alumnos_habilitados').update({habilitado:false}).eq('carnet',insc.carnet);
        }
        await sb.from('inscritos').update({habilitado:false}).eq('id',id);
        insc.habilitado=false;
        actualizarStats();render(filtrar());
      }catch(e){alert('Error: '+e.message);}
    }

    // ---- BÚSQUEDA ----
    document.getElementById('search').addEventListener('input',()=>render(filtrar()));
    function filtrar(){
      const q=document.getElementById('search').value.trim().toLowerCase();
      if(!q)return inscritos;
      return inscritos.filter(i=>
        (i.nombre||'').toLowerCase().includes(q)||
        (i.carnet||'').toLowerCase().includes(q)||
        (i.carrera_objetivo||'').toLowerCase().includes(q)||
        (i.email||'').toLowerCase().includes(q)
      );
    }
  </script>
</body>
</html>
